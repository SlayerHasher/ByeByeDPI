name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        required: true
        default: release
        options:
          - release
          - debug
      prerelease:
        description: "Mark GitHub release as pre-release"
        type: boolean
        required: false
        default: true
      tag:
        description: "Release tag (leave empty to auto-generate, e.g. v1.8.2-123abc)"
        required: false
        type: string
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Get version from gradle file
        run: |
          version=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set build type and tag
        if: always()
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_BUILD_TYPE: ${{ github.event.inputs.build_type }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
            echo "TAG=$REF_NAME" >> "$GITHUB_ENV"
          elif [[ "$INPUT_BUILD_TYPE" == "debug" ]]; then
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
            echo "TAG=${INPUT_TAG:-nightly}" >> "$GITHUB_ENV"
          else
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
            echo "PRERELEASE=${INPUT_PRERELEASE:-true}" >> "$GITHUB_ENV"
            if [[ -n "$INPUT_TAG" ]]; then
              echo "TAG=$INPUT_TAG" >> "$GITHUB_ENV"
            else
              short_sha=$(echo "$SHA" | cut -c1-7)
              echo "TAG=v${VERSION}-${short_sha}" >> "$GITHUB_ENV"
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore (if secrets provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.BYEDPI_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/byedpi.keystore"
          echo "BYEDPI_KEYSTORE_PATH=$RUNNER_TEMP/byedpi.keystore" >> "$GITHUB_ENV"

      - name: Export keystore credentials
        env:
          STORE_PASSWORD: ${{ secrets.BYEDPI_KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BYEDPI_KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BYEDPI_KEYSTORE_KEY_PASSWORD }}
        run: |
          [ -n "$STORE_PASSWORD" ] && echo "BYEDPI_KEYSTORE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          [ -n "$KEY_ALIAS" ] && echo "BYEDPI_KEYSTORE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          [ -n "$KEY_PASSWORD" ] && echo "BYEDPI_KEYSTORE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APKs
        run: ./gradlew assemble${BUILD_TYPE} --no-daemon --stacktrace

      - name: Prepare artifacts
        run: |
          mkdir -p apk-out
          if ! ls app/build/outputs/apk/${BUILD_TYPE}/*.apk >/dev/null 2>&1; then
            echo "No APKs found in app/build/outputs/apk/${BUILD_TYPE}/"; exit 1
          fi
          cp app/build/outputs/apk/${BUILD_TYPE}/*.apk apk-out/
          ls -la apk-out
          for f in apk-out/*.apk; do
            sha256sum "$f" >> apk-out/checksums-sha256.txt
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ByeDpi-${{ env.VERSION }}-${{ env.BUILD_TYPE }}
          path: apk-out/

      - name: Create GitHub Release and upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body: |
            ByeDpi Android ${{ env.VERSION }} (${{ env.BUILD_TYPE }})
            Commit: ${{ github.sha }}

            SHA-256 checksums are in checksums-sha256.txt.
          files: |
            apk-out/*.apk
            apk-out/checksums-sha256.txt
          prerelease: ${{ env.PRERELEASE }}
          make_latest: ${{ env.PRERELEASE == 'false' }}
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
